plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

configurations {
    testCompile
}

allure {
    version = '2.13.8'
    autoconfigure = true
    aspectjweaver = true
}

java {
    sourceCompatibility = JavaVersion.toVersion(21)
    targetCompatibility = JavaVersion.toVersion(21)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.testng', name: 'testng', version: '7.3.0'
    implementation 'com.microsoft.playwright:playwright:1.57.0'
    implementation group: 'io.rest-assured', name: 'rest-assured', version: '5.5.0'
    implementation group: 'io.rest-assured', name: 'json-schema-validator', version: '5.5.0'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.6'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.5.6'
    implementation group: 'io.qameta.allure', name: 'allure-testng', version: '2.25.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.11'
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.2.18'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.1'
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-xml', version: '2.18.1'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.18.1'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.30'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-joda', version: '2.10.3'
    implementation(group: 'net.sf.json-lib', name: 'json-lib-ext-spring', version: '1.0.2') {
        exclude group: 'org.springframework', module: 'spring-webmvc'
        exclude group: 'log4j', module: 'log4j'
    }
    implementation("io.jsonwebtoken:jjwt-api:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.6")
    runtimeOnly group: 'org.aspectj', name: 'aspectjweaver', version: '1.9.22'
    implementation 'org.apache.poi:poi:5.1.0'
    implementation 'org.apache.poi:poi-ooxml:5.1.0'
}


test {
    outputs.upToDateWhen { false }
    ignoreFailures = true

    ['ENV', 'THREAD_COUNT', 'GROUP', 'BROWSER', 'HEADLESS', 'USER_EMAIL', 'USER_PASSWORD'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key)
        }
    }

    doFirst {
        delete fileTree('build/allure-results') { include '**/*' }
    }

    useTestNG() {
        parallel 'methods'
        threadCount = (System.getenv('THREAD_COUNT') ?: project.findProperty('THREAD_COUNT') ?: '4').toInteger()

        def group = System.getenv('GROUP') ?: project.findProperty('GROUP') ?: ''
        if (!group.isEmpty()) {
            includeGroups group
        }
    }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
        showStandardStreams true
    }
}

tasks.register('report') {
    group = 'allure'
    description = 'Generate and serve allure report'
    dependsOn allureReport
    doLast {
        println "\n✅ Report generated, starting server...\n"
    }
    finalizedBy allureServe
}

tasks.named('allureReport') {
    doFirst {
        delete 'build/reports/allure-report'
    }
}



